{{- if not .Values.global.licenseKeySecretRef }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-license
  labels:
    {{- include "electron.labels" . | nindent 4 }}
type: Opaque
stringData:
  license-key: {{ required "global.licenseKey (or global.licenseKeySecretRef) is required: create a licence in the smallest.ai console, Settings, then Licenses" .Values.global.licenseKey | quote }}
{{- end }}
{{- if and .Values.global.imageCredentials.create (not .Values.global.imageCredentialsSecretRef) }}
{{- $c := .Values.global.imageCredentials }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-registry
  labels:
    {{- include "electron.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict $c.registry (dict "username" $c.username "password" $c.password "email" $c.email "auth" (printf "%s:%s" $c.username $c.password | b64enc))) | toJson | b64enc }}
{{- end }}
{{- if not .Values.keysSecretRef }}
{{- $name := printf "%s-keys" .Release.Name }}
{{- $old := dict }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}{{ $old = .data }}{{ end }}
---
# Generated once and kept across upgrades. vllm-api-key is the only key vLLM accepts, and only the
# router holds it; proxy-token opens the license-proxy's local API to the router and engines.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "electron.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall: a reinstall then reuses the same keys, and the apps holding the API key keep working.
    helm.sh/resource-policy: keep
type: Opaque
data:
  api-key: {{ if .Values.apiKey }}{{ .Values.apiKey | b64enc }}{{ else }}{{ get $old "api-key" | default (printf "sk-%s" (randAlphaNum 40) | b64enc) }}{{ end }}
  vllm-api-key: {{ get $old "vllm-api-key" | default (randAlphaNum 48 | b64enc) }}
  proxy-token: {{ get $old "proxy-token" | default (randAlphaNum 48 | b64enc) }}
{{- end }}
